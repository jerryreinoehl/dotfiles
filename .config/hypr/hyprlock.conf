general {
  # Hides the cursor instead of making it visible.
  hide_cursor = true

  # Skips validation when no password is provided.
  ignore_empty_input = true

  # Milliseconds until the ui resets after a failed auth attempt.
  fail_timeout = 1000
}

animations {
  enabled = true
  bezier = almostLinear,0.5,0.5,0.75,1.0
  animation = fadeIn, 1, 1.73, almostLinear
  animation = fadeOut, 1, 1.46, almostLinear
}

background {
  monitor =
  path = /home/jerry/.config/wallpaper
  color = rgb(0, 0, 0)
  blur_passes = 0
}

input-field {
  # Monitor to draw on.
  monitor =

   # Size of the input field.
  size = 64, 64

  # Thickness of the outline.
  outline_thickness = 8

  # Border color.
  #outer_color =

  # Color of the inner box.
  inner_color = rgb(10, 10, 10)

  # Text rendered in the input box when it's empty.
  placeholder_text =

  # Render an input indicator similar to swaylock instead of dots when set to
  # `true`.
  hide_input = true

  # This color's hue is randomly rotated (oklab color space) to get the colors
  # for `hide_input`.
  hide_input_base_color = rgb(0, 100, 180)

  # Color accent when waiting for the authentication result.
  check_color = rgb(40, 80, 100)

  # Text rendered when authentication fails.
  fail_text =

  # Color accent when Caps Lock is active.
  capslock_color = rgb(255, 102, 0)

  # Horizontal alignment.
  halign = center

  # Vertical alignment.
  valign = center
}

label {
  monitor =
  text = cmd[update:1000] echo "<span weight='200'>$(date '+%H:%M')</span>"
  color = rgba(200, 200, 200, 1.0)
  font_size = 80
  font_family = Fira Sans
  position = -40, 20
  halign = right
  valign = bottom
}

label {
  monitor =
  text = cmd[update:1000] echo "<span weight='200'>$(date '+%A, %d %B %Y')</span>"
  color = rgba(200, 200, 200, 1.0)
  font_size = 32
  font_family = Fira Sans
  position = -40, 150
  halign = right
  valign = bottom
}
